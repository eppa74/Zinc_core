name: eppa74

on: [push, pull_request]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            compiler: gcc
          - os: ubuntu-latest
            compiler: clang
          - os: windows-latest
            compiler: msvc
          - os: macos-latest
            compiler: clang

    steps:
    - uses: actions/checkout@v3
    
    - name: Configure (GCC)
      if: matrix.compiler == 'gcc'
      run: cmake -B build -DZINC_BUILD_TESTS=ON -DZINC_BUILD_EXAMPLES=ON -DCMAKE_CXX_COMPILER=g++
    
    - name: Configure (Clang)
      if: matrix.compiler == 'clang'
      run: cmake -B build -DZINC_BUILD_TESTS=ON -DZINC_BUILD_EXAMPLES=ON -DCMAKE_CXX_COMPILER=clang++
    
    - name: Configure (MSVC)
      if: matrix.compiler == 'msvc'
      run: cmake -B build -DZINC_BUILD_TESTS=ON -DZINC_BUILD_EXAMPLES=ON
      
    - name: Build
      run: cmake --build build --config Release
      
    - name: Test
      run: ctest --test-dir build -C Release --output-on-failure
